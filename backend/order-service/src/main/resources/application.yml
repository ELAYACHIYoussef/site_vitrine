server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_order}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:you123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        connection:
          provider_disables_autocommit: false

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

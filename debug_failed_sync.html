 Pour en savoir plus sur le traitement de vos données par Qasa, consultez leur"},"consent-legal-modal-edit":{"text":"Vous aurez la possibilité d’éditer ces données."},"consent-legal-modal-list-data":{"text":"Données d’identité et de contact du bailleur et notamment votre nom, prénom, email et téléphone (tels que renseignés dans votre compte leboncoin),"},"consent-legal-modal-list-infos":{"text":"Descriptif complet et adresse du bien immobilier concerné, tels que renseignés dans votre annonce."},"consent-legal-modal":{"text":"En cliquant sur \"Créer mon brouillon de bail\", vous acceptez que nous (leboncoin) transmettions à Qasa les données nécessaires à la création de votre compte Qasa ainsi que celles utiles pour pré-remplir le contrat de bail. Il s’agit des données suivantes :"},"consent-legal":{"text":"Conditions, limites et exclusions de garantie disponibles sur \u003c0\u003ehttps://qasa.fr\u003c/0\u003e","title":"Mentions légales"},"consent-loading":{"cta":"Chargement..."},"consent-modal-checkbox":{"text":"J’autorise Qasa à transmettre à leboncoin la validation de chaque étape de mon parcours sur Qasa."},"consent-modal-disclaimer":{"text":"Votre souscription à Qasa prendra effet à la signature du bail."},"consent-modal":{"cta":"Accéder à Qasa","text":"Suivez votre demande de gestion locative en autorisant Qasa à nous transmettre les mises à jour de votre parcours.","title":"Gérer ma location avec Qasa"},"consent":{"cta":"Créer mon brouillon de bail"},"customer-service":{"text":"Les experts Qasa sont disponibles 5j/7 pour répondre à vos besoins pendant toute la durée de votre bail. Vous pouvez les joindre directement lors de la création d’un brouillon de bail.","title":"Qasa à votre écoute"},"faq-answer-deposit-1":{"text":"Le montant du dépôt de garantie est équivalent à un mois de loyer hors charges pour les logements non meublés et pouvant aller jusqu’à deux mois pour les logements meublés."},"faq-answer-deposit-2":{"text":"Celui-ci est encaissé et conservé par les soins de Qasa durant toute la durée du bail."},"faq-answer-deposit-3":{"text":"Le remboursement du dépôt de garantie est transparent et se fait dans les délais légaux."},"faq-answer-management-1":{"text":"En tant que propriétaire, vous gardez la main sur la gestion de votre bien (montant du loyer, révisions et régularisation des charges…)."},"faq-answer-management-2":{"text":"Qasa vous met à disposition des outils et vous accompagne afin :"},"faq-answer-management-3":{"text":"D’automatiser les tâches administratives et comptables et ce, durant toute la durée du bail."},"faq-answer-management-4":{"text":"De supprimer le risque financier, en garantissant les paiements des loyers à chaque 5 du mois même en cas d’impayé du locataire."},"faq-answer-management-5":{"text":"\u003cbold\u003eQasa agit en tant que mandataire pour votre compte\u003c/bold\u003e, pour percevoir les loyers et charges et les reverser à date fixe (chaque 5 du mois). \u003cbr /\u003e\u003cbold\u003eQasa n’est pas votre représentant légal\u003c/bold\u003e, en tant que propriétaire, ou votre gestionnaire locatif. Le contrat de bail est conclu entre le locataire et vous, le propriétaire. \u003cbr /\u003e\u003cbold\u003eQasa ne se soustrait pas à vos responsabilités en tant que propriétaire\u003c/bold\u003e ni à vos interactions avec le locataire dans la gestion opérationnelle du bien et ne s’engage pas pour votre compte (gestion des sinistres, travaux et réparations, paiement des charges de copropriété notamment)."},"faq-answer-membership-1":{"text":"Rendez-vous dans votre espace bailleur leboncoin et cliquez sur “Gérer ma location avec Qasa”."},"faq-answer-membership-2":{"text":"Créez votre bail en ligne et invitez votre locataire à le signer."},"faq-answer-membership-3":{"text":"Mila, le partenaire d’assurance de Qasa, effectue les vérifications de solvabilité de votre futur locataire en moins de 6 h."},"faq-answer-membership-4":{"text":"Dès que le locataire est validé, Qasa s’occupe de collecter le dépôt de garantie et vous informe de sa réception."},"faq-answer-membership-5":{"text":"Vous pouvez effectuer l’état des lieux ainsi que la remise des clés."},"faq-answer-membership-6":{"text":"Vous n’avez plus qu’à attendre votre loyer à l’heure et entre-temps, vous pouvez accéder à tous vos documents depuis une interface dédiée intuitive et accessible."},"faq-answer-services-1":{"text":"En tant que partenaire leboncoin, Qasa vous accompagne dans les étapes clés de la gestion locative de votre bien et sécurise vos revenus, quelle que soit la situation de votre locataire."},"faq-answer-services-2":{"text":"L’offre de gestion locative Qasa comprend :"},"faq-answer-services-list":{"array":["Solvabilité certifiée du locataire","Bail numérique signé par voie électronique","Paiement des loyers sécurisés et garantis le 5 de chaque mois","Garantie loyers impayés","Garantie dégradations","Assurance protection juridique","Gestion administrative et comptable déléguées","Interface propriétaire et locataire dédiée intuitive et accessible","Service client dédié 5j/7 et accompagnement personnalisé"]},"faq-answer-services-note":{"text":"\u003cbold\u003eNote\u003c/bold\u003e : ce service est accessible uniquement aux particuliers, pour des baux à usage exclusif d’habitation meublé et vide."},"faq-answer-solvency-1":{"text":"Dans le cadre de la signature de votre bail, Mila, le partenaire d’assurance de Qasa, évalue la solvabilité de vos locataires."},"faq-answer-solvency-2":{"text":"Cette évaluation se fait en plusieurs étapes :"},"faq-answer-solvency-3":{"text":["La soumission digitalisée du dossier par le locataire et sécurisation de ses documents","L’analyse et la vérification de facteurs financiers du locataire (situation professionnelle, revenus…) lors de la signature du bail.","La validation et la certification assurée par Mila, professionnel assureur et partenaire de Qasa."]},"faq-answer-solvency-4":{"text":"Cette évaluation permet de vous assurer la stabilité financière de votre futur locataire et sa capacité à honorer ses obligations financières, pour signer votre bail en toute sérénité."},"faq-answer-tenant":{"text":"Qasa ne propose pas la recherche du locataire et n’est pas partie prenante à la signature du bail entre le propriétaire et le locataire. Toutefois, Qasa assure de la solvabilité de votre locataire, vous pouvez donc avoir l’esprit tranquille."},"faq-documents-complete":{"text":"Compléter au mieux votre annonce sur leboncoin, afin d’avoir toutes les informations à portée de main"},"faq-documents-previous-lease":{"text":"Récupérer et garder à côté de vous vos anciens baux"},"faq-documents-saving-tips":{"text":"Pour gagner du temps dans la création de votre bail, nous vous conseillons de :"},"faq-documents":{"text":["Votre dossier de diagnostic technique, incluant notamment la performance énergétique","Votre pièce d’identité"],"title":"Seulement 2 documents sont indispensables à la création et signature de votre bail :"},"faq-engagement-default":{"text":"Par défaut, la résiliation du bail entraîne la résiliation du mandat de gestion."},"faq-engagement-flexibility":{"text":"Afin de vous garantir une flexibilité totale, les services Qasa sont sans engagement et peuvent être résiliés à tout moment moyennant un préavis de deux mois minimum incluant le dernier jour du mois en cours."},"faq-engagement-implication":{"text":"En cas de résiliation des services Qasa par le bailleur, la garantie Loyers Impayés Mila, souscrite lors de la mise en place du mandat Qasa, sera également résiliée de plein droit et ce à la même date."},"faq-engagement-note":{"text":"Note importante : Pour toute question sur le sujet de la gestion locative, veuillez contacter le service client Qasa via \u003c0\u003ece formulaire de contact\u003c/0\u003e."},"faq-engagement-renewal":{"text":"A l’issue de cette période le mandat sera reconduit tacitement d’année en année dans la limite maximum de 10 ans."},"faq-engagement-termination":{"text":"La demande de

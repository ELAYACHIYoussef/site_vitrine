version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE - Supabase est utilisé comme DB cloud (pas de postgres local)
  # ---------------------------------------------------------------------------
  discovery-service:
    build:
      context: ./ecommerce-backend
      dockerfile: discovery-service/Dockerfile
    container_name: azymarket-discovery
    ports:
      - "8761:8761"
    networks:
      - azymarket-net
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # CORE SERVICES
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./ecommerce-backend
      dockerfile: api-gateway/Dockerfile
    container_name: azymarket-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - azymarket-net

  # ---------------------------------------------------------------------------
  # MICROSERVICES - Connectés à Supabase Cloud
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ./ecommerce-backend
      dockerfile: auth-service/Dockerfile
    container_name: azymarket-auth
    ports:
      - "8081:8081"
    environment:
      # Supabase Pooler (Transaction Mode, IPv4, port 6543)
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      # Eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      # OAuth2 Google
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Force IPv4 dans la JVM
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
      - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
    depends_on:
      - discovery-service
    networks:
      - azymarket-net
    restart: on-failure

  catalog-service:
    build:
      context: ./ecommerce-backend
      dockerfile: catalog-service/Dockerfile
    container_name: azymarket-catalog
    ports:
      - "8082:8082"
    environment:
      # Supabase Pooler
      - SPRING_DATASOURCE_URL=${CATALOG_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      # Eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      # Force IPv4
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - INSTAGRAM_ACCOUNT_ID=${INSTAGRAM_ACCOUNT_ID}
    depends_on:
      - discovery-service
    networks:
      - azymarket-net
    restart: on-failure

  order-service:
    build:
      context: ./ecommerce-backend
      dockerfile: order-service/Dockerfile
    container_name: azymarket-order
    ports:
      - "8083:8083"
    environment:
      # Supabase Pooler
      - SPRING_DATASOURCE_URL=${ORDER_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      # Eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      # Force IPv4
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      # Debug logging
      - LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
      - LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL=TRACE
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG
    depends_on:
      - discovery-service
    networks:
      - azymarket-net
    restart: on-failure

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    build: ./ecommerce-frontend
    container_name: azymarket-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - azymarket-net

networks:
  azymarket-net:
    driver: bridge
